<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notable — Markdown Notes</title>
<meta name="description" content="Notable: a fast Markdown notes app with live preview and search. Notes are saved in your browser.">
<meta name="theme-color" content="#eef3fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='4' fill='%232563eb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3fb; --ink:#14213d; --muted:#5b6b86; --line:#d6e0f0;
    --card:#fafcff; --accent:#2563eb; --accent-ink:#fff; --soft:#e2ebfa; --danger:#c62f3d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1424; --ink:#e6edf8; --muted:#8fa0bd; --line:#1f2b45;
      --card:#141d33; --accent:#5b9bff; --accent-ink:#0d1424; --soft:#1a2644; --danger:#ff7a86;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'JetBrains Mono',ui-monospace,monospace;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{display:grid;grid-template-columns:290px 1fr;height:100vh;height:100dvh}

  /* sidebar */
  .sidebar{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:24px;padding:20px 18px 6px;letter-spacing:-.5px}
  .brand span{color:var(--accent)}
  .tag{padding:0 18px 14px;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
  .side-tools{padding:0 14px 12px;display:grid;gap:10px}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
  .search:focus{border-color:var(--accent)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13px;transition:transform .1s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  #list{list-style:none;overflow-y:auto;flex:1;padding:0 8px 8px}
  #list li button{
    width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;
    padding:10px 10px;display:grid;gap:3px;margin-bottom:2px
  }
  #list li button:hover{background:var(--soft)}
  #list li.active button{background:var(--soft);border-color:var(--accent)}
  .n-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin{color:var(--accent)}
  .none{color:var(--muted);padding:14px 10px;font-size:13px}
  .back{padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:12px}
  .back:hover{color:var(--accent)}

  /* main */
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
  .bar>*{flex-shrink:0}
  .icon{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
  .fmt{display:flex;gap:4px}
  .fmt button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:13px}
  .fmt button:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
  .seg button{border:0;background:var(--card);padding:8px 12px;font-size:12px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .acts{display:flex;gap:6px}
  .acts .btn{padding:8px 11px;font-size:12px}
  .acts .danger.sure{background:var(--danger);color:#fff;border-color:var(--danger)}

  .panes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  #main[data-view=edit] .panes,#main[data-view=preview] .panes{grid-template-columns:1fr}
  #main[data-view=edit] #pv{display:none}
  #main[data-view=preview] #ed{display:none}
  #ed{
    resize:none;border:0;border-right:1px solid var(--line);outline:none;background:var(--card);
    padding:22px 24px;line-height:1.7;font-size:14px;min-height:0;tab-size:2
  }
  #main[data-view=edit] #ed,#main[data-view=preview] #ed{border-right:0}
  #pv{overflow-y:auto;padding:22px 30px 60px;background:var(--bg);min-height:0}
  .status{display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;background:var(--card)}

  /* rendered markdown */
  .md{font-family:'Fraunces',Georgia,serif;font-size:17px;line-height:1.7;max-width:42em}
  .md>*+*{margin-top:.85em}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.2;letter-spacing:-.4px;font-weight:600}
  .md h1{font-size:2em;margin-top:0}
  .md h2{font-size:1.5em;margin-top:1.3em;padding-bottom:.2em;border-bottom:1px solid var(--line)}
  .md h3{font-size:1.2em;margin-top:1.2em}
  .md a{color:var(--accent)}
  .md ul,.md ol{padding-left:1.4em}
  .md li{margin:.2em 0}
  .md li.task{list-style:none;margin-left:-1.4em;display:flex;gap:.55em;align-items:baseline}
  .md li.task input{accent-color:var(--accent);width:1em;height:1em;cursor:pointer;transform:translateY(2px)}
  .md li.task.done span{text-decoration:line-through;color:var(--muted)}
  .md blockquote{border-left:4px solid var(--accent);padding:.2em 1em;color:var(--muted);background:var(--soft);border-radius:0 8px 8px 0}
  .md blockquote>*+*{margin-top:.5em}
  .md code{font-family:'JetBrains Mono',monospace;font-size:.82em;background:var(--soft);padding:.15em .4em;border-radius:5px}
  .md pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
  .md pre code{background:none;padding:0;font-size:.82em;line-height:1.6}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
  .md table{border-collapse:collapse;width:100%;font-size:.9em;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:.45em .8em;text-align:left}
  .md th{background:var(--soft)}
  .md del{color:var(--muted)}

  .backdrop{display:none}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px #0004}
    .sidebar.open{transform:none}
    .backdrop.show{display:block;position:fixed;inset:0;background:#0006;z-index:10}
    .icon{display:block}
    .seg [data-v=split]{display:none}
    .bar{flex-wrap:wrap;overflow:visible;gap:8px}
    .seg{margin-left:auto;order:1}
    .fmt{order:3;width:100%;overflow-x:auto}
    .acts{order:2;flex:1 0 100%;order:4}
    .acts .btn{flex:1}
    #ed{padding:18px 16px}
    #pv{padding:18px 18px 60px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Notes">
    <div class="brand">Notable<span>.</span></div>
    <div class="tag">Markdown notes</div>
    <div class="side-tools">
      <input id="q" class="search" type="search" placeholder="Search notes…" aria-label="Search notes">
      <button id="new" class="btn primary">+ New note</button>
    </div>
    <ul id="list"></ul>
    <a class="back" href="../">← Back to portfolio</a>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main id="main" data-view="split">
    <div class="bar">
      <button class="icon" id="menu" aria-label="Open notes list">☰ Notes</button>
      <div class="fmt" role="toolbar" aria-label="Formatting">
        <button data-f="h" title="Heading"><b>H</b></button>
        <button data-f="b" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-f="i" title="Italic (Ctrl+I)"><i>I</i></button>
        <button data-f="c" title="Inline code">&lt;/&gt;</button>
        <button data-f="l" title="Link">🔗</button>
        <button data-f="u" title="Bullet list">•</button>
        <button data-f="t" title="Checklist">☑</button>
        <button data-f="q" title="Quote">❝</button>
      </div>
      <div class="seg" id="seg">
        <button data-v="edit">Edit</button>
        <button data-v="split" class="on" data-v-default>Split</button>
        <button data-v="preview">Preview</button>
      </div>
      <div class="acts">
        <button class="btn" id="pinBtn">☆ Pin</button>
        <button class="btn" id="dl">Download .md</button>
        <button class="btn danger" id="del">Delete</button>
      </div>
    </div>
    <div class="panes">
      <textarea id="ed" spellcheck="true" aria-label="Note editor" placeholder="Start typing in Markdown…"></textarea>
      <article id="pv" class="md-wrap" aria-label="Preview"><div class="md" id="md"></div></article>
    </div>
    <div class="status"><span id="st">Saved</span><span id="wc"></span></div>
  </main>
</div>

<script>
/*MD-START*/
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<em>$2</em>');
  s = s.replace(/(^|[\s(])_(?!\s)([^_]+?)_(?=[\s).,!?:;]|$)/g,'$1<em>$2</em>');
  s = s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s = s.replace(/\u0000(\d+)\u0000/g, function(m,i){ return '<code>'+codes[i]+'</code>'; });
  return s;
}
function blocks(lines, base, tasks){
  const out = []; let i = 0;
  const isBlank = l => /^\s*$/.test(l);
  const isFence = l => /^```/.test(l);
  const isHead  = l => /^#{1,6}\s/.test(l);
  const isHr    = l => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
  const isQuote = l => /^\s{0,3}>/.test(l);
  const listRe  = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const isTable = (a,b) => a && b && a.indexOf('|')>-1 && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(b);
  while(i < lines.length){
    const l = lines[i]; let m;
    if(isBlank(l)){ i++; continue; }
    if(isFence(l)){
      const buf = []; i++;
      while(i < lines.length && !isFence(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    if(isHead(l) && (m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){
      const n = m[1].length; out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>'); i++; continue;
    }
    if(isHr(l)){ out.push('<hr>'); i++; continue; }
    if(isQuote(l)){
      const buf = [];
      while(i < lines.length && isQuote(lines[i])){ buf.push(lines[i].replace(/^\s{0,3}>\s?/,'')); i++; }
      out.push('<blockquote>'+blocks(buf,0,false)+'</blockquote>'); continue;
    }
    if(isTable(l, lines[i+1])){
      const split = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = split(l), rows = []; i += 2;
      while(i < lines.length && !isBlank(lines[i]) && lines[i].indexOf('|')>-1){ rows.push(split(lines[i])); i++; }
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    if((m = l.match(listRe))){
      const ordered = /\d/.test(m[2]); const items = []; let mm;
      while(i < lines.length && (mm = lines[i].match(listRe)) && /\d/.test(mm[2]) === ordered){
        items.push({t:mm[3], ln:base+i}); i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<'+tag+'>'+items.map(it=>{
        const tk = tasks && it.t.match(/^\[( |x|X)\]\s+(.*)$/);
        if(tk){
          const done = tk[1] !== ' ';
          return '<li class="task'+(done?' done':'')+'"><input type="checkbox" data-ln="'+it.ln+'"'+(done?' checked':'')+'><span>'+inline(tk[2])+'</span></li>';
        }
        return '<li>'+inline(it.t)+'</li>';
      }).join('')+'</'+tag+'>');
      continue;
    }
    const buf = [];
    while(i < lines.length && !isBlank(lines[i]) && !isFence(lines[i]) && !isHead(lines[i]) &&
          !isQuote(lines[i]) && !isHr(lines[i]) && !listRe.test(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push('<p>'+inline(buf.join('\n')).replace(/\n/g,'<br>')+'</p>');
  }
  return out.join('\n');
}
function renderMarkdown(src){ return blocks(src.replace(/\r\n?/g,'\n').split('\n'), 0, true); }
/*MD-END*/

/* ---------- app ---------- */
const $ = id => document.getElementById(id);
const ed=$('ed'), md=$('md'), list=$('list'), q=$('q'), main=$('main');
const KEY='notable-notes-v1', AKEY='notable-active-v1';

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true;}catch(e){return false;} }
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const WELCOME = [
'# Welcome to Notable',
'',
'A fast notes app that speaks **Markdown**. Everything you write is saved in *this browser* — no account needed.',
'',
'## Try it',
'- [x] Open this note',
'- [ ] Click a checkbox in the preview to tick it',
'- [ ] Press **+ New note** and write your own',
'- [ ] Search for a word in the box on the left',
'',
'## What works',
'Use `#` for headings, `**bold**`, `*italic*`, `~~strike~~` and [links](https://github.com).',
'',
'> Good notes are short, searchable and easy to find again.',
'',
'| Shortcut | Action |',
'|---|---|',
'| Ctrl/Cmd + B | Bold |',
'| Ctrl/Cmd + I | Italic |',
'',
'```',
'const hello = "code blocks work too";',
'```'
].join('\n');

let notes = store.get(KEY, null);
if(!Array.isArray(notes) || !notes.length){
  notes = [{id:uid(), body:WELCOME, updated:Date.now(), pinned:true}];
}
let activeId = store.get(AKEY, null);
if(!notes.some(n=>n.id===activeId)) activeId = notes[0].id;

const active = () => notes.find(n=>n.id===activeId);
function titleOf(n){
  const line = (n.body.split('\n').find(l=>l.trim())||'').replace(/^#{1,6}\s*/,'').replace(/[*_`~]/g,'').trim();
  return line || 'Untitled';
}
function snippetOf(n){
  const lines = n.body.split('\n').filter(l=>l.trim());
  return (lines[1]||'').replace(/^[#>\-*\s\[\]x]+/,'').slice(0,70);
}
function fmtDate(t){
  const d=new Date(t), now=new Date();
  return d.toDateString()===now.toDateString()
    ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString([], {day:'numeric',month:'short'});
}

let saveTimer=null;
function persist(){
  const ok = store.set(KEY, notes) && store.set(AKEY, activeId);
  $('st').textContent = ok ? 'Saved · '+fmtDate(Date.now()) : 'Could not save (browser storage is blocked)';
}
function scheduleSave(){ $('st').textContent='Saving…'; clearTimeout(saveTimer); saveTimer=setTimeout(persist,300); }

function renderList(){
  const term = q.value.trim().toLowerCase();
  const shown = notes
    .filter(n => !term || n.body.toLowerCase().includes(term))
    .sort((a,b)=> (b.pinned-a.pinned) || (b.updated-a.updated));
  list.innerHTML='';
  if(!shown.length){ list.innerHTML='<li class="none">No notes match “'+esc(q.value)+'”.</li>'; return; }
  shown.forEach(n=>{
    const li=document.createElement('li'); if(n.id===activeId) li.className='active';
    const b=document.createElement('button');
    b.innerHTML='<span class="n-title">'+(n.pinned?'<span class="pin">★ </span>':'')+esc(titleOf(n))+'</span>'+
                '<span class="n-meta">'+fmtDate(n.updated)+' · '+esc(snippetOf(n)||'No more text')+'</span>';
    b.onclick=()=>{ select(n.id); closeDrawer(); };
    li.append(b); list.append(li);
  });
}
function renderPreview(){
  md.innerHTML = renderMarkdown(ed.value);
  const words = (ed.value.match(/\S+/g)||[]).length;
  $('wc').textContent = words+' word'+(words===1?'':'s')+' · '+ed.value.length+' chars';
}
function renderBar(){
  const n=active();
  $('pinBtn').textContent = n.pinned ? '★ Pinned' : '☆ Pin';
  document.title = titleOf(n)+' — Notable';
}
function select(id){
  activeId=id; const n=active();
  ed.value=n.body; renderPreview(); renderList(); renderBar(); persist();
  resetDelete();
}

ed.addEventListener('input',()=>{
  const n=active(); n.body=ed.value; n.updated=Date.now();
  renderPreview(); renderList(); renderBar(); scheduleSave();
});
q.addEventListener('input',renderList);

function newNote(){
  const n={id:uid(), body:'# New note\n\n', updated:Date.now(), pinned:false};
  notes.push(n); q.value='';
  select(n.id);
  if(main.dataset.view==='preview') setView('edit');
  ed.focus(); ed.setSelectionRange(2,10);
}
$('new').onclick=()=>{ newNote(); closeDrawer(); };

$('pinBtn').onclick=()=>{ const n=active(); n.pinned=!n.pinned; renderList(); renderBar(); persist(); };

let delTimer=null;
function resetDelete(){ clearTimeout(delTimer); $('del').textContent='Delete'; $('del').classList.remove('sure'); }
$('del').onclick=()=>{
  const b=$('del');
  if(!b.classList.contains('sure')){
    b.textContent='Sure?'; b.classList.add('sure'); delTimer=setTimeout(resetDelete,3000); return;
  }
  resetDelete();
  notes = notes.filter(n=>n.id!==activeId);
  if(!notes.length) notes.push({id:uid(), body:'# New note\n\n', updated:Date.now(), pinned:false});
  select(notes.slice().sort((a,b)=>b.updated-a.updated)[0].id);
};

$('dl').onclick=()=>{
  try{
    const n=active();
    const name=(titleOf(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'note')+'.md';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([n.body],{type:'text/markdown'}));
    a.download=name; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){ $('st').textContent='Download is not available here'; }
};

/* checkbox toggling from the preview */
md.addEventListener('change',e=>{
  const t=e.target; if(!(t instanceof HTMLInputElement) || t.dataset.ln==null) return;
  const lines=ed.value.split('\n'), i=+t.dataset.ln;
  lines[i]=lines[i].replace(/\[( |x|X)\]/, t.checked?'[x]':'[ ]');
  ed.value=lines.join('\n');
  ed.dispatchEvent(new Event('input'));
});

/* view switching */
const narrow = window.matchMedia('(max-width: 820px)');
function setView(v){
  if(narrow.matches && v==='split') v='edit';
  main.dataset.view=v;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
$('seg').onclick=e=>{ if(e.target.dataset.v) setView(e.target.dataset.v); };
narrow.addEventListener('change',()=>setView(main.dataset.view));
setView(narrow.matches?'edit':'split');

/* drawer (mobile) */
const sb=$('sidebar'), bd=$('backdrop');
function closeDrawer(){ sb.classList.remove('open'); bd.classList.remove('show'); }
$('menu').onclick=()=>{ sb.classList.add('open'); bd.classList.add('show'); };
bd.onclick=closeDrawer;

/* formatting toolbar */
function fire(){ ed.dispatchEvent(new Event('input')); }
function wrap(a,b,ph){
  ed.focus();
  const s=ed.selectionStart,e=ed.selectionEnd, sel=ed.value.slice(s,e)||ph;
  ed.setRangeText(a+sel+b,s,e,'end');
  ed.setSelectionRange(s+a.length,s+a.length+sel.length); fire();
}
function prefix(p){
  ed.focus();
  const s=ed.selectionStart, ls=ed.value.lastIndexOf('\n',s-1)+1;
  ed.setRangeText(p,ls,ls,'end'); fire();
}
const FMT={
  h:()=>prefix('## '), b:()=>wrap('**','**','bold'), i:()=>wrap('*','*','italic'),
  c:()=>wrap('`','`','code'), l:()=>wrap('[','](https://)','link text'),
  u:()=>prefix('- '), t:()=>prefix('- [ ] '), q:()=>prefix('> ')
};
document.querySelector('.fmt').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(main.dataset.view==='preview') setView('edit');
  FMT[b.dataset.f]();
};
ed.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && !e.altKey){
    const k=e.key.toLowerCase();
    if(k==='b'){ e.preventDefault(); FMT.b(); }
    if(k==='i'){ e.preventDefault(); FMT.i(); }
    if(k==='s'){ e.preventDefault(); clearTimeout(saveTimer); persist(); }
  }
});

select(activeId);
</script>
</body>
</html>
